[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphagent-ui-lite"
version = "0.1.0"
description = "MorphAgent UI Lite — single-env Qt desktop (no Allen / no sandbox)"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
  "qtpy>=2.4",
]

[project.optional-dependencies]
ui = [
  "PyQt5>=5.15",
]
napari = [
  "napari[all]>=0.5.6",
]
test = [
  "pytest>=8",
  "pytest-qt>=4.4",
]

[project.entry-points."napari.manifest"]
morphagent = "morphagent_ui:napari.yaml"

[tool.setuptools.packages.find]
include = ["morphagent_ui*"]

[tool.setuptools.package-data]
morphagent_ui = ["napari.yaml", "resources/*.png"]
