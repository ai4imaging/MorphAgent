# =============================================================================
# MorphAgent — Allen segmentation environment (OPTIONAL / legacy)
# =============================================================================
# Isolated Python 3.6 stack for classic Allen aicssegmentation.
# Create with Apple Silicon Rosetta pins:
#   CONDA_SUBDIR=osx-64 conda env create -f environment_allen.yml
# Then install pip extras via scripts/setup.sh (preferred).
#
# The MorphAgent TIFF driver (run_segment_image_tif.py) uses tifffile +
# aicssegmentation only — it does NOT require aicsimageio / aicspylibczi.
# =============================================================================
name: morphagent_allen
channels:
  - defaults
dependencies:
  - python=3.6
  - pip
